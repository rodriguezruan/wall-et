<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#AF52DE" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded App Icon Squircle -->
  <rect width="100" height="100" rx="22" fill="#000000" />
  <!-- Wallet Card Silhouette -->
  <rect x="18" y="24" width="64" height="42" rx="8" fill="url(#appleGradient)" filter="url(#cardShadow)" />
  <rect x="22" y="38" width="56" height="38" rx="8" fill="#1C1C1E" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <circle cx="68" cy="57" r="6" fill="#FF9500" opacity="0.8" />
  <circle cx="60" cy="57" r="6" fill="#FF3B30" opacity="0.8" />
  <!-- Minimalist Chip -->
  <rect x="28" y="52" width="10" height="8" rx="2" fill="#E5E5EA" />
</svg>
